[workspace]
members = [
    "crates/agentctl",
    "crates/bevy_agent_core",
    "crates/bevy_agent_snapshot",
    "crates/bevy_agent_replay",
    "crates/bevy_agent_runner",
    "crates/bevy_agent_remote",
    "crates/sample_platformer",
]
resolver = "3"

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/briansunter/bevy-agent"
homepage = "https://briansunter.github.io/bevy-agent/"
publish = ["crates-io"]
include = ["src/**", "examples/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bevy = { version = "0.18.1", default-features = false, features = ["std", "bevy_log", "bevy_state", "serialize"] }
bitflags = { version = "2.10.0", features = ["serde"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
jsonschema = { version = "0.33", default-features = false }
rand = "0.9.2"
rand_chacha = { version = "0.9.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = { version = "1.0", features = ["uuid1"] }
sha1 = "0.10.6"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

bevy_agent_core = { version = "=0.0.4", path = "crates/bevy_agent_core" }
bevy_agent_snapshot = { version = "=0.0.4", path = "crates/bevy_agent_snapshot" }
bevy_agent_replay = { version = "=0.0.4", path = "crates/bevy_agent_replay" }
bevy_agent_runner = { version = "=0.0.4", path = "crates/bevy_agent_runner" }
bevy_agent_remote = { version = "=0.0.4", path = "crates/bevy_agent_remote" }
