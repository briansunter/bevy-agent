[package]
name = "bevy_agent_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runner API that owns and steps controllable Bevy agent simulation apps."
readme = "README.md"
include.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
documentation = "https://briansunter.github.io/bevy-agent/getting-started.html"
keywords = ["bevy", "gamedev", "agent", "runner"]
categories = ["game-development", "simulation"]

[features]
default = []
visual = ["bevy/bevy_render", "bevy/bevy_window", "bevy/png"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bevy_agent_core.workspace = true
bevy_agent_snapshot.workspace = true
bevy_agent_replay.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[package.metadata.docs.rs]
all-features = true
