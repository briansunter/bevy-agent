name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation tests
        run: cargo test --workspace --doc --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Python tests
        run: python3 -m unittest discover -s python/tests

      - name: Build clients and headless examples
        run: cargo build --workspace --bins --examples --locked

      - name: Real transport smoke checks
        run: python3 scripts/smoke.py

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: visual

      - name: Install Bevy Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev xvfb xauth mesa-vulkan-drivers

      - name: All-feature Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: All-feature tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build primary-window capture smoke test
        run: cargo build -p sample_platformer --example primary_window_smoke --features visual --locked

      - name: Exercise real rendering and primary-window capture
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a -s '-screen 0 1280x720x24' target/debug/examples/primary_window_smoke "$RUNNER_TEMP/primary-window-smoke"

      - name: Save rendered capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: primary-window-capture
          path: ${{ runner.temp }}/primary-window-smoke

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Exercise the JSON-RPC parser with libFuzzer
        working-directory: fuzz
        run: cargo fuzz run rpc_request -- -max_total_time=30 -max_len=1048576

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python tests
        run: python3 -m unittest discover -s python/tests
