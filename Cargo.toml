[workspace]
members = [
    "crates/bevy_agent_core",
    "crates/bevy_agent_snapshot",
    "crates/bevy_agent_replay",
    "crates/bevy_agent_runner",
    "crates/bevy_agent_remote",
    "crates/sample_platformer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.100"
bevy = { version = "0.18.1", default-features = false, features = ["std", "bevy_log", "bevy_state", "serialize"] }
bitflags = { version = "2.10.0", features = ["serde"] }
rand = "0.9.2"
rand_chacha = { version = "0.9.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

bevy_agent_core = { path = "crates/bevy_agent_core" }
bevy_agent_snapshot = { path = "crates/bevy_agent_snapshot" }
bevy_agent_replay = { path = "crates/bevy_agent_replay" }
bevy_agent_runner = { path = "crates/bevy_agent_runner" }
bevy_agent_remote = { path = "crates/bevy_agent_remote" }
sample_platformer = { path = "crates/sample_platformer" }
