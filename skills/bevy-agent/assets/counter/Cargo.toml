[package]
name = "bevy-agent-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["std", "bevy_log", "bevy_state", "serialize"] }
bevy_agent_core = "=0.0.4"
bevy_agent_runner = "=0.0.4"
bevy_agent_snapshot = "=0.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Keep the copied starter independent of a parent workspace.
[workspace]
