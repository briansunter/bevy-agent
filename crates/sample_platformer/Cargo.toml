[package]
name = "sample_platformer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sample headless platformer demonstrating bevy_agent_control integration."
readme.workspace = true
documentation = "https://docs.rs/sample_platformer"
keywords = ["bevy", "gamedev", "platformer", "agent"]
categories = ["game-development", "simulation"]

[features]
default = []
visual = ["bevy/2d", "bevy/png", "bevy_agent_runner/visual", "bevy_agent_remote/visual"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bevy_agent_core.workspace = true
bevy_agent_replay.workspace = true
bevy_agent_runner.workspace = true
bevy_agent_snapshot.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
bevy_agent_remote.workspace = true

[[example]]
name = "remote_http_visual"
required-features = ["visual"]
