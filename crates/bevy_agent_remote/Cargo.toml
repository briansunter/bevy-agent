[package]
name = "bevy_agent_remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JSON-RPC, HTTP, WebSocket, and stdio remote-control bridge for Bevy agent."
readme = "README.md"
include.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
documentation = "https://docs.rs/bevy_agent_remote"
keywords = ["bevy", "gamedev", "json-rpc", "agent"]
categories = ["game-development", "network-programming"]

[features]
default = []
visual = [
    "bevy/bevy_render",
    "bevy/bevy_window",
    "bevy/png",
    "bevy_agent_runner/visual",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bevy.workspace = true
bevy_agent_core.workspace = true
bevy_agent_runner.workspace = true
bevy_agent_snapshot.workspace = true
bitflags.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha1.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[package.metadata.docs.rs]
all-features = true
